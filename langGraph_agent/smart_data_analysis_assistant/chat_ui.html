<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatBI 数据分析智能助手</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --border: #e5e7eb;
    --text: #1f2937;
    --sub: #6b7280;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --user-bubble: #2563eb;
    --user-text: #ffffff;
    --ai-bubble: #f3f4f6;
    --ai-text: #1f2937;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    height: 100vh;
    display: flex;
    flex-direction: column;
    color: var(--text);
  }
  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header .logo {
    width: 34px; height: 34px; border-radius: 8px;
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: bold; font-size: 18px;
  }
  header h1 { font-size: 16px; font-weight: 600; }
  header .status { font-size: 12px; color: var(--sub); margin-left: auto; display: flex; align-items: center; gap: 6px; }
  header .dot { width: 8px; height: 8px; border-radius: 50%; background: #9ca3af; }
  header .dot.on { background: #22c55e; }

  #chat {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .msg { display: flex; gap: 10px; max-width: 80%; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.ai { align-self: flex-start; }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: bold; color: #fff;
  }
  .msg.user .avatar { background: #2563eb; }
  .msg.ai .avatar { background: linear-gradient(135deg, #7c3aed, #2563eb); }
  .bubble {
    padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.6;
    white-space: pre-wrap; word-break: break-word;
  }
  .msg.user .bubble { background: var(--user-bubble); color: var(--user-text); border-bottom-right-radius: 4px; }
  .msg.ai .bubble { background: var(--ai-bubble); color: var(--ai-text); border-bottom-left-radius: 4px; }

  .typing { display: inline-flex; gap: 4px; align-items: center; padding: 4px 0; }
  .typing span { width: 6px; height: 6px; border-radius: 50%; background: #9ca3af; animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 60%, 100% { opacity: 0.2; } 30% { opacity: 1; } }

  footer {
    background: var(--panel); border-top: 1px solid var(--border);
    padding: 14px 20px;
  }
  .input-row { display: flex; gap: 10px; max-width: 900px; margin: 0 auto; }
  textarea {
    flex: 1; resize: none; border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 14px; font-size: 14px; font-family: inherit; line-height: 1.5;
    outline: none; max-height: 120px; min-height: 44px;
  }
  textarea:focus { border-color: var(--accent); }
  button {
    border: none; background: var(--accent); color: #fff; border-radius: 10px;
    padding: 0 22px; font-size: 14px; cursor: pointer; font-weight: 500;
    transition: background 0.15s;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { background: #9ca3af; cursor: not-allowed; }
  .hint { text-align: center; font-size: 12px; color: var(--sub); margin-top: 8px; }
</style>
</head>
<body>
  <header>
    <div class="logo">BI</div>
    <h1>ChatBI 数据分析智能助手</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">检测中...</span></div>
  </header>

  <div id="chat">
    <div class="msg ai">
      <div class="avatar">AI</div>
      <div class="bubble">你好，我是 ChatBI 数据分析助手。你可以问我：\n· 科学计算（6666乘以8888）\n· 写代码（写一个冒泡排序）\n· 业务查询（食品类价格最高的前3个商品）\n· 数据分析（分析王一珂的用户画像）\n· 可视化（绘制洗碗布月销量柱状图）</div>
    </div>
  </div>

  <footer>
    <div class="input-row">
      <textarea id="input" placeholder="输入你的问题，回车发送..." rows="1"></textarea>
      <button id="send">发送</button>
    </div>
    <div class="hint">服务地址：http://localhost:9008/chatbi_service</div>
  </footer>

<script>
  const API = "http://localhost:9008/chatbi_service";
  const chat = document.getElementById("chat");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const dot = document.getElementById("dot");
  const statusText = document.getElementById("statusText");

  // 检查服务是否在线
  async function checkStatus() {
    try {
      const r = await fetch(API, { method: "OPTIONS" });
      dot.classList.add("on");
      statusText.textContent = "服务在线";
    } catch (e) {
      dot.classList.remove("on");
      statusText.textContent = "服务离线（请先运行 start_all.ps1）";
    }
  }

  function addMsg(role, text) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = role === "user" ? "我" : "AI";
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    div.appendChild(avatar);
    div.appendChild(bubble);
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return bubble;
  }

  function addTyping() {
    const div = document.createElement("div");
    div.className = "msg ai";
    div.id = "typing-msg";
    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = "AI";
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
    div.appendChild(avatar);
    div.appendChild(bubble);
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById("typing-msg");
    if (t) t.remove();
  }

  async function send() {
    const text = input.value.trim();
    if (!text) return;
    addMsg("user", text);
    input.value = "";
    input.style.height = "auto";
    sendBtn.disabled = true;
    addTyping();

    try {
      const resp = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ user_id: "u1", message: text, history: [] })
      });
      removeTyping();
      if (!resp.ok) {
        const err = await resp.text();
        addMsg("ai", "请求失败（HTTP " + resp.status + "）：\n" + err);
      } else {
        const data = await resp.json();
        addMsg("ai", data.message || JSON.stringify(data));
      }
    } catch (e) {
      removeTyping();
      addMsg("ai", "连接服务失败，请确认服务已启动：\n" + e.message);
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  sendBtn.addEventListener("click", send);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });
  // 自动调整输入框高度
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 120) + "px";
  });

  checkStatus();
</script>
</body>
</html>
